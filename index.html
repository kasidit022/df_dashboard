<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f1e8">
<title>DF Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f1e8;
  --paper: #fdfaf3;
  --card: #ffffff;
  --ink: #1a1814;
  --ink-soft: #4a453d;
  --muted: #8c8478;
  --line: #e8e2d3;
  --line-soft: #f0ebde;
  --accent: #c2410c;
  --accent-soft: #fed7aa;
  --accent-bg: #fff4e8;
  --money: #15803d;
  --money-bg: #dcfce7;
  --off: #b91c1c;
  --off-bg: #fee2e2;
  --gold: #b45309;
}

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "IBM Plex Sans Thai", "Noto Sans Thai", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'tnum' on, 'lnum' on;
  user-select: none;
  -webkit-user-select: none;
  font-size: 15px;
  line-height: 1.45;
}

input, textarea, select { user-select: text; -webkit-user-select: text; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* HEADER */
.header { background: var(--paper); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); flex-shrink: 0; }
.header-inner { padding: 14px 18px 10px; }
.header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.header-title {
  font-family: "Iowan Old Style", "Palatino", Georgia, serif;
  font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em;
  display: flex; align-items: baseline; gap: 8px;
}
.header-title-mark { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; align-self: center; margin-bottom: 2px; }
.header-title-sub { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0.02em; margin-top: 2px; }
.header-actions { display: flex; gap: 4px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; background: transparent; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); transition: all 0.15s; }
.icon-btn:active { background: var(--line-soft); transform: scale(0.96); }
.icon-btn svg { width: 18px; height: 18px; }

/* Month bar */
.month-bar-wrap { border-top: 1px solid var(--line-soft); position: relative; }
.month-bar-wrap::before, .month-bar-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 16px; pointer-events: none; z-index: 2; }
.month-bar-wrap::before { left: 0; background: linear-gradient(90deg, var(--paper), transparent); }
.month-bar-wrap::after { right: 0; background: linear-gradient(-90deg, var(--paper), transparent); }
.month-bar { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 6px 12px 8px; }
.month-bar::-webkit-scrollbar { display: none; }
.month-pill { flex-shrink: 0; padding: 8px 14px; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border: none; white-space: nowrap; font-family: inherit; position: relative; transition: color 0.2s; }
.month-pill.active { color: var(--accent); font-weight: 700; }
.month-pill.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 16px; height: 2px; background: var(--accent); border-radius: 2px; }
.month-pill .y { font-size: 10px; opacity: 0.7; margin-left: 2px; }

/* STATS */
.stats-row { display: flex; background: var(--paper); border-bottom: 1px solid var(--line); }
.stat-cell { flex: 1; padding: 12px 14px; border-right: 1px solid var(--line-soft); }
.stat-cell:last-child { border-right: none; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; font-weight: 500; }
.stat-value { font-family: "Iowan Old Style", "Palatino", Georgia, serif; font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height: 1.1; }
.stat-value .currency { font-size: 13px; font-weight: 400; color: var(--muted); margin-right: 1px; }
.stat-value.green { color: var(--money); }
.stat-value.red { color: var(--off); }
.stat-value .unit { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 3px; font-family: inherit; }

/* TYPE TABS */
.type-tabs { display: flex; gap: 6px; padding: 10px 14px; background: var(--paper); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.type-tabs::-webkit-scrollbar { display: none; }
.type-tab { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; background: transparent; font-size: 12.5px; border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; white-space: nowrap; font-family: inherit; font-weight: 500; }
.type-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* MAIN */
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }

/* Section header */
.section-head { padding: 14px 18px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.section-head-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.section-head-side { font-size: 11px; color: var(--muted); font-family: "Iowan Old Style", Georgia, serif; font-style: italic; }

/* List */
.list { padding: 0 14px 90px; }
.df-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; position: relative; transition: all 0.15s; }
.df-item:active { background: var(--paper); transform: scale(0.995); }
.df-row { display: flex; align-items: center; gap: 12px; }
.df-day-num { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-bg); color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Iowan Old Style", Georgia, serif; font-weight: 700; font-size: 18px; line-height: 1; flex-shrink: 0; letter-spacing: -0.02em; }
.df-day-num.off { background: var(--off-bg); color: var(--off); }
.df-day-num .month-tag { font-family: -apple-system, sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.05em; margin-top: 2px; opacity: 0.75; text-transform: uppercase; }
.df-info { flex: 1; min-width: 0; }
.df-branch { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.df-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.df-amount { font-family: "Iowan Old Style", Georgia, serif; font-size: 16px; font-weight: 700; color: var(--ink); text-align: right; letter-spacing: -0.02em; white-space: nowrap; }
.df-amount .currency { font-size: 11px; font-weight: 400; color: var(--muted); margin-right: 1px; }
.off-badge { display: inline-block; padding: 3px 9px; background: var(--off-bg); color: var(--off); border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; font-family: -apple-system, sans-serif; }
.off-tag { display: inline-block; background: var(--off); color: white; font-size: 9px; padding: 1px 6px; border-radius: 999px; font-weight: 700; letter-spacing: 0.08em; font-family: -apple-system, sans-serif; }
.mini-bar { height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.mini-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ea580c); border-radius: 2px; transition: width 0.4s ease; }
.mini-bar-fill.off { background: var(--off); opacity: 0.3; }

/* Empty */
.empty { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; font-family: "Iowan Old Style", Georgia, serif; }
.empty-title { font-size: 15px; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
.empty-sub { font-size: 13px; color: var(--muted); }

/* OVERVIEW */
.overview { padding: 14px 14px 90px; }
.hero-card { background: var(--ink); color: var(--paper); border-radius: 18px; padding: 22px; margin-bottom: 10px; position: relative; overflow: hidden; }
.hero-card::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(194,65,12,0.4), transparent 70%); }
.hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.6; font-weight: 500; margin-bottom: 6px; position: relative; }
.hero-value { font-family: "Iowan Old Style", Georgia, serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; position: relative; }
.hero-value .currency { font-size: 18px; font-weight: 400; opacity: 0.5; margin-right: 4px; }
.hero-sub { font-size: 12px; margin-top: 12px; opacity: 0.85; display: flex; gap: 18px; font-family: "Iowan Old Style", Georgia, serif; position: relative; }
.hero-sub-item .lab { font-size: 9px; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.1em; font-family: -apple-system, sans-serif; margin-bottom: 2px; }
.hero-sub-item .val { font-weight: 600; font-size: 14px; }
.hero-sub-item .val.minus { color: #fda4af; }
.hero-sub-item .val.plus { color: #86efac; }

.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.metric-card { background: var(--card); border: 1px solid var(--line); padding: 14px; border-radius: 14px; }
.metric-label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.1em; font-weight: 500; margin-bottom: 6px; }
.metric-value { font-family: "Iowan Old Style", Georgia, serif; font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height: 1.15; }
.metric-value .currency { font-size: 12px; font-weight: 400; color: var(--muted); margin-right: 1px; }
.metric-value.red { color: var(--off); }
.metric-value.green { color: var(--money); }
.metric-sub { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: -apple-system, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chart-card { background: var(--card); border: 1px solid var(--line); padding: 16px 14px 12px; border-radius: 14px; margin-bottom: 10px; }
.chart-title { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.1em; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
.chart-title-side { font-size: 10px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; font-family: "Iowan Old Style", Georgia, serif; font-style: italic; }
.chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding: 4px 0 0; }
.chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; cursor: pointer; }
.chart-bar { width: 100%; max-width: 22px; background: var(--accent); border-radius: 2px 2px 0 0; transition: opacity 0.2s; min-height: 3px; }
.chart-bar.off { background: var(--off); opacity: 0.25; }
.chart-bar-label { font-size: 9px; color: var(--muted); font-family: -apple-system, sans-serif; }
.chart-bar-col.current .chart-bar-label { color: var(--accent); font-weight: 700; }
.chart-h-scroll { display: flex; align-items: flex-end; gap: 3px; height: 110px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chart-h-scroll::-webkit-scrollbar { display: none; }
.chart-h-scroll .chart-bar-col { flex: 0 0 22px; }

/* BRANCH */
.branch-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
.branch-rank { width: 26px; height: 26px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: "Iowan Old Style", Georgia, serif; font-size: 13px; font-weight: 700; color: var(--ink-soft); flex-shrink: 0; }
.branch-rank.gold { background: var(--gold); color: white; border-color: var(--gold); }
.branch-rank.silver { background: var(--ink-soft); color: white; border-color: var(--ink-soft); }
.branch-rank.bronze { background: var(--accent); color: white; border-color: var(--accent); }
.branch-info { flex: 1; min-width: 0; }
.branch-name { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.branch-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.branch-amount { font-family: "Iowan Old Style", Georgia, serif; font-size: 16px; font-weight: 700; color: var(--ink); text-align: right; letter-spacing: -0.01em; }
.branch-amount .currency { font-size: 11px; font-weight: 400; color: var(--muted); margin-right: 1px; }

.divider-text { display: flex; align-items: center; gap: 10px; padding: 10px 4px 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }
.divider-text::before, .divider-text::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* FAB */
.fab { position: absolute; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: white; border: none; box-shadow: 0 6px 18px rgba(194,65,12,0.35), 0 0 0 1px rgba(194,65,12,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: transform 0.15s; }
.fab:active { transform: scale(0.92); }
.fab svg { width: 22px; height: 22px; }

/* BOTTOM NAV */
.bottom-nav { display: flex; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
.nav-btn { flex: 1; padding: 10px 4px 8px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 500; font-family: inherit; position: relative; transition: color 0.15s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 2px; background: var(--accent); border-radius: 2px; }
.nav-btn svg { width: 22px; height: 22px; }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(26,24,20,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal-backdrop.show { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal { background: var(--paper); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 12px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; animation: slideUp 0.25s cubic-bezier(0.16,1,0.3,1); }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.modal-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-family: "Iowan Old Style", Georgia, serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
.modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; margin-bottom: 14px; }
.form-row > * { flex: 1; min-width: 0; }
.form-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.form-input, .form-select { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; background: var(--card); font-family: inherit; color: var(--ink); -webkit-appearance: none; appearance: none; }
.form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); background: white; }
.form-select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238c8478' d='M6 8L0 0h12z'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 32px; }
.form-checkbox { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.form-checkbox input { width: 20px; height: 20px; accent-color: var(--off); }
.form-checkbox span { font-size: 14px; color: var(--ink-soft); flex: 1; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s, transform 0.15s; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: white; }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn-danger { background: var(--off-bg); color: var(--off); }
.danger-zone { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

.menu-item { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.menu-item:active { background: var(--paper); }
.menu-item-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.menu-item-title.danger { color: var(--off); }
.menu-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.menu-item-arrow { color: var(--muted); font-size: 18px; }

/* TOAST */
.toast { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-120%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 200; transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); pointer-events: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.18); max-width: 90%; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* PC */
@media (min-width: 600px) {
  body { background: #ebe6d5; }
  #app { box-shadow: 0 0 0 1px var(--line), 0 16px 48px rgba(0,0,0,0.06); }
}
@media (min-width: 900px) {
  #app { max-width: 560px; margin-top: 24px; margin-bottom: 24px; height: calc(100vh - 48px); height: calc(100dvh - 48px); border-radius: 20px; overflow: hidden; }
}
</style>
</head>
<body>

<div id="app">
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div>
          <div class="header-title">
            <span class="header-title-mark"></span>
            <span id="header-title">DF Ledger</span>
          </div>
          <div class="header-title-sub" id="header-sub">เม.ย. 2569</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-menu" title="เมนู" aria-label="เมนู">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="month-bar-wrap">
      <div class="month-bar" id="month-bar"></div>
    </div>
  </header>

  <div id="stats-container"></div>
  <div id="filter-container"></div>

  <main class="main" id="main"></main>

  <button class="fab" id="fab" aria-label="เพิ่มรายการ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="df">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>DF</span>
    </button>
    <button class="nav-btn" data-tab="exp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>ค่าใช้จ่าย</span>
    </button>
    <button class="nav-btn" data-tab="ov">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>ภาพรวม</span>
    </button>
    <button class="nav-btn" data-tab="br">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>สาขา</span>
    </button>

const STORAGE_KEY = 'df_dashboard_v1';
const DB_NAME = 'df_dashboard_db';
const DB_STORE = 'data';

// IndexedDB wrapper - more reliable than localStorage on iOS Safari
let _db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    openDB().then(db => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }).catch(reject);
  });
}
function idbSet(key, value) {
  return new Promise((resolve, reject) => {
    openDB().then(db => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }).catch(reject);
  });
}

// ============ STORAGE ============
function ensureStructure(d) {
  if (!d.dfData) d.dfData = {};
  if (!d.expData) d.expData = {};
  MONTHS.forEach(m => { if (!d.dfData[m]) d.dfData[m] = []; if (!d.expData[m]) d.expData[m] = []; });
  return d;
}
async function loadData() {
  // Try IndexedDB first
  try {
    const v = await idbGet(STORAGE_KEY);
    if (v) return ensureStructure(typeof v === 'string' ? JSON.parse(v) : v);
  } catch (e) { console.warn('IDB load failed', e); }
  // Migrate from old localStorage if present
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = ensureStructure(JSON.parse(s));
      try { await idbSet(STORAGE_KEY, parsed); } catch(_) {}
      return parsed;
    }
  } catch (e) { console.warn('LS load failed', e); }
  return ensureStructure(JSON.parse(JSON.stringify(DEFAULT_DATA)));
}

let _saveTimer = null;
function saveData() {
  // Debounce saves slightly to avoid hammering disk
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    const payload = JSON.stringify(state.data);
    idbSet(STORAGE_KEY, payload).catch(e => {
      console.error('IDB save failed', e);
      // Fallback: localStorage
      try { localStorage.setItem(STORAGE_KEY, payload); }
      catch (_) { showToast('⚠️ บันทึกไม่สำเร็จ'); }
    });
    // Always also write to localStorage as a backup mirror (best-effort)
    try { localStorage.setItem(STORAGE_KEY, payload); } catch(_) {}
  }, 50);
}

// ============ UTILS ============
const $ = id => document.getElementById(id);
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'style') n.style.cssText = attrs[k];
    else if (k.startsWith('on')) n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (children != null) {
    if (typeof children === 'string') n.textContent = children;
    else if (Array.isArray(children)) children.forEach(c => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    else n.appendChild(children);
  }
  return n;
}
function fmtMoney(n) {
  if (n == null) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function fmtMoneyExact(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function sumValues(arr) { return arr.reduce((s, x) => s + (x.v || 0), 0); }
function thaiDate(monthStr, day) {
  const [mon, yy] = monthStr.split(' ');
  return day + ' ' + (MONTH_THAI[mon] || mon) + ' ' + (parseInt(yy) + 2543);
}
function thaiMonthFull(monthStr) {
  const [mon, yy] = monthStr.split(' ');
  return (MONTH_THAI_FULL[mon] || mon) + ' ' + (parseInt(yy) + 2543);
}
function thaiMonthShort(monthStr) {
  const [mon, yy] = monthStr.split(' ');
  return (MONTH_THAI[mon] || mon) + ' ' + (parseInt(yy) + 43);
}

let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

  const monShort = MONTH_THAI[mon] || mon;

  sorted.forEach(item => {
    const isOff = item.v == null;
    const pct = isOff ? 100 : (item.v / maxV * 100);
    const dayStr = String(item.d).padStart(2, '0');
    const card = el('div', {
      class: 'df-item',
      onclick: () => openEditDf(item._idx)
    }, [
      el('div', { class: 'df-row' }, [
        el('div', { class: 'df-day-num' + (isOff ? ' off' : '') }, [
          document.createTextNode(dayStr),
          el('div', { class: 'month-tag' }, monShort)
        ]),

          el('div', { class: 'df-meta' }, [

// ============ OVERVIEW ============
function renderOverview() {
  const main = $('main');
  main.innerHTML = '';
  const dfArr = state.data.dfData[state.month] || [];
  const expArr = state.data.expData[state.month] || [];
  const dfTotal = sumValues(dfArr);
  const expTotal = sumValues(expArr);
  const net = dfTotal - expTotal;
  const workDays = dfArr.filter(x => x.v != null).length;
  const offDays = dfArr.filter(x => x.v == null).length;
  const avg = workDays > 0 ? dfTotal / workDays : 0;

  const branchMap = {};
  dfArr.forEach(x => { if (x.v != null) branchMap[x.b] = (branchMap[x.b] || 0) + x.v; });
  const topBranch = Object.entries(branchMap).sort((a, b) => b[1] - a[1])[0];

  const sec = el('div', { class: 'overview' });

  sec.appendChild(el('div', { class: 'hero-card' }, [
    el('div', { class: 'hero-label' }, 'ยอดสุทธิ — ' + thaiMonthFull(state.month)),
    el('div', { class: 'hero-value' }, [
      el('span', { class: 'currency' }, '฿'),
      document.createTextNode(fmtMoneyExact(net))
    ]),
    el('div', { class: 'hero-sub' }, [
      el('div', { class: 'hero-sub-item' }, [
        el('div', { class: 'lab' }, 'DF'),
        el('div', { class: 'val plus' }, '฿' + fmtMoney(dfTotal))
      ]),
      el('div', { class: 'hero-sub-item' }, [
        el('div', { class: 'lab' }, 'ค่าใช้จ่าย'),
        el('div', { class: 'val minus' }, '−฿' + fmtMoney(expTotal))
      ])
    ])
  ]));

  const grid = el('div', { class: 'metric-grid' });
  grid.appendChild(el('div', { class: 'metric-card' }, [
    el('div', { class: 'metric-label' }, 'วันทำงาน'),
    el('div', { class: 'metric-value' }, [document.createTextNode(workDays), el('span', { class: 'currency' }, ' วัน')])
  ]));
  grid.appendChild(el('div', { class: 'metric-card' }, [
    el('div', { class: 'metric-label' }, 'OFF'),
    el('div', { class: 'metric-value red' }, [document.createTextNode(offDays), el('span', { class: 'currency' }, ' วัน')])
  ]));
  grid.appendChild(el('div', { class: 'metric-card' }, [
    el('div', { class: 'metric-label' }, 'เฉลี่ย/วัน'),
    el('div', { class: 'metric-value green' }, [el('span', { class: 'currency' }, '฿'), document.createTextNode(fmtMoney(avg))])
  ]));
  grid.appendChild(el('div', { class: 'metric-card' }, [
    el('div', { class: 'metric-label' }, 'สาขายอดเยี่ยม'),
    el('div', { class: 'metric-value', style: 'font-size:15px' }, topBranch ? topBranch[0] : '—'),
    el('div', { class: 'metric-sub' }, topBranch ? '฿' + fmtMoney(topBranch[1]) : '')
  ]));
  sec.appendChild(grid);

  if (dfArr.length > 0) {
    const sorted = [...dfArr].sort((a, b) => a.d - b.d);
    const validVals = sorted.filter(x => x.v != null).map(x => x.v);
    const maxV = validVals.length ? Math.max(...validVals) : 1;
    const chartCard = el('div', { class: 'chart-card' }, [
      el('div', { class: 'chart-title' }, [
        document.createTextNode('DF รายวัน'),
        el('span', { class: 'chart-title-side' }, 'สูงสุด ฿' + fmtMoney(maxV))
      ])
    ]);
    const chart = el('div', { class: 'chart-h-scroll' });
    sorted.forEach(x => {
      const isOff = x.v == null;
      const h = isOff ? 6 : Math.max(4, x.v / maxV * 100);
      chart.appendChild(el('div', { class: 'chart-bar-col' }, [
        el('div', { class: 'chart-bar' + (isOff ? ' off' : ''), style: 'height:' + h + '%' }),
        el('div', { class: 'chart-bar-label' }, String(x.d))
      ]));
    });
    chartCard.appendChild(chart);
    sec.appendChild(chartCard);
  }

  const monthVals = MONTHS.map(m => sumValues(state.data.dfData[m] || []));
  const maxM = Math.max(...monthVals, 1);
  const trendCard = el('div', { class: 'chart-card' }, [
    el('div', { class: 'chart-title' }, [
      document.createTextNode('แนวโน้ม 13 เดือน'),
      el('span', { class: 'chart-title-side' }, 'รวม ฿' + fmtMoney(monthVals.reduce((s,v)=>s+v,0)))
    ])
  ]);
  const trendChart = el('div', { class: 'chart-bars' });
  MONTHS.forEach((m, i) => {
    const v = monthVals[i];
    const h = Math.max(3, v / maxM * 100);
    const isCurrent = m === state.month;
    const [mon] = m.split(' ');
    trendChart.appendChild(el('div', {
      class: 'chart-bar-col' + (isCurrent ? ' current' : ''),
      onclick: () => switchMonth(m)
    }, [
      el('div', { class: 'chart-bar', style: 'height:' + h + '%' + (isCurrent ? '' : ';background:#d4cdb9') }),
      el('div', { class: 'chart-bar-label' }, MONTH_THAI[mon] ? MONTH_THAI[mon].replace('.','') : mon)
    ]));
  });
  trendCard.appendChild(trendChart);
  sec.appendChild(trendCard);

  main.appendChild(sec);
}

// ============ BRANCH ============
function renderBranches() {
  const main = $('main');
  main.innerHTML = '';
  const dfArr = state.data.dfData[state.month] || [];
  const map = {};
  dfArr.forEach(x => {
    if (!map[x.b]) map[x.b] = { total: 0, count: 0, off: 0 };
    if (x.v != null) { map[x.b].total += x.v; map[x.b].count++; }
    else { map[x.b].off++; }
  });
  const list = Object.entries(map).map(([b, v]) => ({ b, ...v })).sort((a, b) => b.total - a.total);

  if (list.length === 0) {
    main.appendChild(emptyState('◌', 'ยังไม่มีข้อมูลสาขา', 'เลือกเดือนอื่นหรือเพิ่มข้อมูล'));
    return;
  }

  const sec = el('div', { class: 'overview' });
  const totalAll = list.reduce((s, x) => s + x.total, 0);
  sec.appendChild(el('div', { class: 'hero-card' }, [
    el('div', { class: 'hero-label' }, 'สรุปสาขา — ' + thaiMonthFull(state.month)),
    el('div', { class: 'hero-value' }, [
      document.createTextNode(list.length),
      el('span', { class: 'currency' }, ' สาขา')
    ]),
    el('div', { class: 'hero-sub' }, [
      el('div', { class: 'hero-sub-item' }, [
        el('div', { class: 'lab' }, 'DF รวม'),
        el('div', { class: 'val plus' }, '฿' + fmtMoney(totalAll))
      ]),
      el('div', { class: 'hero-sub-item' }, [
        el('div', { class: 'lab' }, 'อันดับ 1'),
        el('div', { class: 'val' }, list[0] ? list[0].b : '—')
      ])
    ])
  ]));

  sec.appendChild(el('div', { class: 'divider-text' }, 'อันดับ'));

  list.forEach((x, i) => {
    const pct = totalAll > 0 ? x.total / totalAll * 100 : 0;
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    sec.appendChild(el('div', { class: 'branch-item' }, [
      el('div', { class: 'branch-rank ' + rankClass }, String(i + 1)),
      el('div', { class: 'branch-info' }, [
        el('div', { class: 'branch-name' }, x.b),
        el('div', { class: 'branch-meta' }, x.count + ' ครั้ง' + (x.off > 0 ? ' · OFF ' + x.off : '') + ' · ' + pct.toFixed(1) + '%'),
        el('div', { class: 'mini-bar', style: 'margin-top:6px' }, [
          el('div', { class: 'mini-bar-fill', style: 'width:' + pct + '%' })
        ])
      ]),
      el('div', { class: 'branch-amount' }, [
        el('span', { class: 'currency' }, '฿'),
        document.createTextNode(fmtMoney(x.total))
      ])
    ]));
  });

  main.appendChild(sec);
}

// ============ HELPERS ============
function emptyState(icon, title, sub) {
  return el('div', { class: 'empty' }, [
    el('div', { class: 'empty-icon' }, icon),
    el('div', { class: 'empty-title' }, title),
    el('div', { class: 'empty-sub' }, sub)
  ]);
}
function getAllBranches() {
  const set = new Set();
  Object.values(state.data.dfData).forEach(arr => arr.forEach(x => x.b && set.add(x.b)));
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'th'));
}
function renderNav() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  $('fab').style.display = (state.tab === 'df' || state.tab === 'exp') ? 'flex' : 'none';
}
function render() {
  renderHeader();
  renderStats();
  renderFilter();
  switch (state.tab) {
    case 'df': renderDfList(); break;
    case 'exp': renderExpList(); break;
    case 'ov': renderOverview(); break;
    case 'br': renderBranches(); break;
  }
  renderNav();
  $('main').scrollTop = 0;
}
function switchMonth(m) { if (m === state.month) return; state.month = m; render(); }
function switchTab(t) { state.tab = t; render(); }

// ============ MODAL ============
function openModal(content) {
  const c = $('modal-content');
  c.innerHTML = '';
  c.appendChild(el('div', { class: 'modal-handle' }));
  if (Array.isArray(content)) content.forEach(x => x && c.appendChild(x));
  else c.appendChild(content);
  $('modal-backdrop').classList.add('show');
}
function closeModal() { $('modal-backdrop').classList.remove('show'); }

// ============ DF MODAL ============
function buildDfForm(initial, isEdit, onSave, onDelete) {
  const branches = getAllBranches();
  const dlId = 'dl-' + Date.now();
  const dayInput = el('input', { class: 'form-input', type: 'number', min: '1', max: '31', inputmode: 'numeric', value: String(initial.d) });
  const branchInput = el('input', { class: 'form-input', type: 'text', list: dlId, value: initial.b || '', placeholder: 'พิมพ์หรือเลือก' });
  const valInput = el('input', { class: 'form-input', type: 'number', step: '0.01', inputmode: 'decimal', value: initial.v != null ? String(initial.v) : '', placeholder: '0.00' });
  const offInput = el('input', { type: 'checkbox' });
  if (isEdit && initial.v == null) { offInput.checked = true; valInput.disabled = true; }
  offInput.onchange = () => { valInput.disabled = offInput.checked; if (offInput.checked) valInput.value = ''; };

  const dl = el('datalist', { id: dlId });
  branches.forEach(b => dl.appendChild(el('option', { value: b })));

  return el('div', {}, [
    dl,
    el('div', { class: 'form-row' }, [
      el('div', {}, [el('label', { class: 'form-label' }, 'วันที่'), dayInput]),
      el('div', { style: 'flex:2' }, [el('label', { class: 'form-label' }, 'สาขา'), branchInput])
    ]),
    el('div', { class: 'form-group' }, [
      el('label', { class: 'form-label' }, 'จำนวน DF (บาท)'),
      valInput
    ]),
    el('div', { class: 'form-group' }, [
      el('label', { class: 'form-checkbox' }, [
        offInput,
        el('span', {}, 'วันหยุด (OFF) — ไม่มีค่า DF')
      ])
    ]),
    el('div', { class: 'btn-row' }, [
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'ยกเลิก'),
      el('button', { class: 'btn btn-primary', onclick: () => {
        const d = parseInt(dayInput.value);
        const b = branchInput.value.trim();
        const v = offInput.checked ? null : (valInput.value === '' ? null : parseFloat(valInput.value));
        if (!d || d < 1 || d > 31) return showToast('⚠️ วันที่ไม่ถูกต้อง');
        if (!b) return showToast('⚠️ กรุณาใส่ชื่อสาขา');
        if (!offInput.checked && (v == null || isNaN(v))) return showToast('⚠️ ใส่จำนวน หรือ ติ๊ก OFF');
        onSave({ d, b, v });
      } }, 'บันทึก')
    ]),
    onDelete ? el('div', { class: 'danger-zone' }, [
      el('button', { class: 'btn btn-danger', style: 'width:100%', onclick: onDelete }, 'ลบรายการนี้')
    ]) : null
  ]);
}

function openAddDf() {
  const arr = state.data.dfData[state.month];
  const today = new Date().getDate();
  const form = buildDfForm({ d: today, b: '', v: '' }, false, (v) => {
    arr.push(v); saveData(); closeModal(); render(); showToast('✓ เพิ่มแล้ว');
  });
  openModal([
    el('div', { class: 'modal-title' }, 'เพิ่มรายการ DF'),
    el('div', { class: 'modal-subtitle' }, thaiMonthFull(state.month)),
    form
  ]);
}

function openEditDf(idx) {
  const arr = state.data.dfData[state.month];
  const item = arr[idx];
  if (!item) return;
  const form = buildDfForm(item, true, (v) => {
    arr[idx] = v; saveData(); closeModal(); render(); showToast('✓ บันทึกแล้ว');
  }, () => {
    if (confirm('ลบรายการ "' + item.b + ' (วันที่ ' + item.d + ')"?')) {
      arr.splice(idx, 1); saveData(); closeModal(); render(); showToast('✓ ลบแล้ว');

  openModal([
    el('div', { class: 'modal-title' }, 'แก้ไขรายการ DF'),
    el('div', { class: 'modal-subtitle' }, thaiMonthFull(state.month)),
    form
  ]);
}

      }
    }, true),
    el('div', { style: 'margin-top:14px;padding:10px;text-align:center;font-size:11px;color:var(--muted);font-family:Iowan Old Style,Georgia,serif;font-style:italic' },
      'DF Ledger · บันทึกอัตโนมัติบนเครื่องนี้'),
    el('div', { class: 'btn-row', style: 'margin-top:8px' }, [
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'ปิด')
    ])
  ]);
}

// ============ EXPORT/IMPORT ============
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ts = new Date().toISOString().slice(0, 10);
    a.download = 'df_backup_' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('✓ ส่งออกแล้ว');
  } catch (e) {
    showToast('⚠️ ส่งออกไม่สำเร็จ');
  }
}

function importData(file) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.dfData || typeof d.dfData !== 'object') throw new Error('Invalid');
      if (confirm('ทับข้อมูลเดิมด้วยไฟล์นี้?\n(แนะนำให้ส่งออกข้อมูลปัจจุบันก่อน)')) {
        state.data = ensureStructure(d);
        saveData(); render(); showToast('✓ นำเข้าแล้ว');
      }
    } catch (err) {
      showToast('⚠️ ไฟล์ไม่ถูกต้อง');
    }
  };
  r.readAsText(file);
}

// ============ SWIPE ============
let swipeStart = null;
let swipeMoved = false;
function setupSwipe() {
  const main = $('main');
  main.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
      swipeMoved = false;
    }
  }, { passive: true });
  main.addEventListener('touchmove', e => {
    if (!swipeStart) return;
    const dx = e.touches[0].clientX - swipeStart.x;
    const dy = e.touches[0].clientY - swipeStart.y;
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) swipeMoved = true;
  }, { passive: true });
  main.addEventListener('touchend', e => {
    if (!swipeStart || !swipeMoved) { swipeStart = null; return; }
    const dx = e.changedTouches[0].clientX - swipeStart.x;
    const dt = Date.now() - swipeStart.t;
    if (Math.abs(dx) > 60 && dt < 800) {
      const idx = MONTHS.indexOf(state.month);
      if (dx < 0 && idx < MONTHS.length - 1) switchMonth(MONTHS[idx + 1]);
      else if (dx > 0 && idx > 0) switchMonth(MONTHS[idx - 1]);
    }
    swipeStart = null;
  });
}

// ============ INIT ============
async function init() {
  state.data = await loadData();

  // Default to last month with data
  for (let i = MONTHS.length - 1; i >= 0; i--) {
    if ((state.data.dfData[MONTHS[i]] || []).length > 0) {
      state.month = MONTHS[i]; break;
    }
  }

  document.querySelectorAll('.nav-btn').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
  });

  $('fab').onclick = () => {
    if (state.tab === 'df') openAddDf();
    else if (state.tab === 'exp') openAddExp();
  };

  $('btn-menu').onclick = openMenu;

  $('file-input').onchange = e => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  };

  $('modal-backdrop').onclick = e => {
    if (e.target === $('modal-backdrop')) closeModal();
  };

  setupSwipe();
  render();
}

init();
</script>
