  --text-dim:#3a3a3a;
  --success:#22c55e;
  --danger:#ef4444;
  --info:#3b82f6;
  --purple:#a78bfa;
  --nav-h:64px;
  --header-h:54px;
  --month-h:46px;
  --font-body:'Sarabun',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* HEADER */
#header{
  height:var(--header-h);flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
}
#header-logo{display:flex;align-items:center;gap:8px}
#header-logo .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent)}
#header-logo h1{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent);letter-spacing:0.06em}
#header-actions{display:flex;gap:6px}
.icon-btn{
  width:34px;height:34px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);transition:all .15s;flex-shrink:0
}
.icon-btn:hover,.icon-btn:active{background:var(--accent-dim);color:var(--accent);border-color:rgba(245,158,11,0.4)}

/* MONTH BAR */
#month-bar{
  height:var(--month-h);flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:center;gap:4px;padding:0 12px;
  scrollbar-width:none;
}
#month-bar::-webkit-scrollbar{display:none}
.month-chip{
  flex-shrink:0;height:28px;padding:0 13px;border-radius:14px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-muted);font-family:var(--font-mono);font-size:11.5px;
  cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none
}
.month-chip:hover{border-color:rgba(245,158,11,0.4);color:var(--text)}
.month-chip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.month-chip.no-data{opacity:0.35;font-style:italic}

/* CONTENT */
#content{flex:1;overflow:hidden;position:relative}
.tab-page{display:none;height:100%;overflow-y:auto;padding:12px 12px calc(var(--nav-h) + 16px)}
.tab-page.active{display:block}
.tab-page::-webkit-scrollbar{width:3px}
.tab-page::-webkit-scrollbar-track{background:transparent}
.tab-page::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* BOTTOM NAV */
#bottom-nav{height:var(--nav-h);flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;color:var(--text-muted);font-size:10.5px;
  border:none;background:none;transition:color .15s;font-family:var(--font-body);
}
.nav-item svg{width:20px;height:20px}
.nav-item.active{color:var(--accent)}
@media(max-width:380px){.nav-item{font-size:9.5px}.nav-item svg{width:18px;height:18px}}

/* INVEST */
.inv-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.inv-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.inv-summary-card.full{grid-column:span 2;background:linear-gradient(135deg,var(--surface) 0%,var(--accent-dim2) 100%)}
.inv-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .15s
}
.inv-item:active{background:var(--surface2)}
.inv-row1{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.inv-icon{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;font-family:var(--font-mono)
}
.inv-icon.crypto{background:rgba(245,158,11,0.15);color:var(--accent)}
.inv-icon.gold{background:rgba(234,179,8,0.15);color:#fbbf24}
.inv-icon.stock_us{background:rgba(59,130,246,0.15);color:#60a5fa}
.inv-icon.stock_th{background:rgba(34,197,94,0.15);color:#4ade80}
.inv-name{flex:1;min-width:0}
.inv-name-main{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-name-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.inv-pl{text-align:right;flex-shrink:0;font-family:var(--font-mono)}
.inv-pl-amt{font-size:13px;font-weight:600}
.inv-pl-pct{font-size:11px;margin-top:1px}
.inv-pl.up{color:var(--success)}
.inv-pl.down{color:var(--danger)}
.inv-pl.flat{color:var(--text-muted)}
.inv-row2{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);padding-top:6px;border-top:1px dashed var(--border)}
.inv-row2 span{display:flex;gap:4px;align-items:center}
.inv-row2 b{color:var(--text);font-weight:500}
.refresh-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--text-muted)
}
.refresh-bar button{
  background:var(--accent);color:#000;border:none;border-radius:7px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body);
  display:flex;align-items:center;gap:5px
}
.refresh-bar button:disabled{opacity:0.5;cursor:not-allowed}
.refresh-bar .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FAB */
.fab{
  position:fixed;bottom:calc(var(--nav-h) + 14px);right:14px;
  width:50px;height:50px;background:var(--accent);border-radius:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:none;box-shadow:0 4px 24px rgba(245,158,11,0.45);transition:transform .15s;z-index:100
}
.fab:active{transform:scale(0.93)}
.fab svg{color:#000;width:22px;height:22px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.card-row{display:flex;align-items:center;justify-content:space-between}

/* MONTH SUMMARY */
.month-summary{
  background:linear-gradient(135deg,var(--surface) 0%,var(--accent-dim2) 100%);
  border:1px solid var(--border);border-radius:12px;padding:14px;
  margin-bottom:10px;display:flex;gap:0
}
.ms-stat{flex:1;padding:0 12px;border-right:1px solid var(--border);text-align:center}
.ms-stat:first-child{padding-left:0;text-align:left}
.ms-stat:last-child{border-right:none;text-align:right}
.ms-label{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px}
.ms-value{font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--accent)}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.section-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em}
.section-count{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}

/* DF ITEM */
.df-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:border-color .15s,background .15s
}
.df-item:active{background:var(--surface2);border-color:rgba(245,158,11,0.3)}
.df-date{
  width:34px;height:34px;background:var(--accent-dim);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0
}
.df-info{flex:1;min-width:0}
.df-branch{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.df-value{font-family:var(--font-mono);font-size:13.5px;font-weight:600;text-align:right;flex-shrink:0}
.df-value.has-v{color:var(--success)}
.df-value.no-v{color:var(--text-muted)}
.df-minibar{width:40px;height:3px;background:var(--border);border-radius:2px;flex-shrink:0;overflow:hidden}
.df-minibar-fill{height:100%;background:var(--success);border-radius:2px;min-width:2px}
.off-badge{
  background:rgba(239,68,68,0.12);color:var(--danger);
  font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:20px;border:1px solid rgba(239,68,68,0.3);
  font-family:var(--font-mono);letter-spacing:0.04em;flex-shrink:0
}
.off-toggle{
  display:flex;align-items:center;gap:10px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:12px;cursor:pointer;margin-bottom:13px;
  transition:border-color .15s
}
.off-toggle.active{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.06)}
.off-toggle-label{flex:1;font-size:14px;font-weight:600}
.off-toggle-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.toggle-dot{
  width:44px;height:26px;border-radius:13px;background:var(--border);
  position:relative;transition:background .2s;flex-shrink:0
}
.toggle-dot::after{
  content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)
}
.off-toggle.active .toggle-dot{background:var(--danger)}
.off-toggle.active .toggle-dot::after{left:21px}
.insight-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.insight-row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.insight-row:last-child{border-bottom:none;padding-bottom:0}
.insight-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.insight-txt{font-size:13px;line-height:1.5;color:var(--text)}

/* EXP ITEM */
.exp-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:border-color .15s
}
.exp-item:active{background:var(--surface2)}
.exp-badge{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;flex-shrink:0}
.exp-badge.t{background:rgba(59,130,246,.15);color:#60a5fa}
.exp-badge.h{background:rgba(168,85,247,.15);color:#c084fc}
.exp-badge.d{background:rgba(34,197,94,.15);color:#4ade80}
.exp-info{flex:1;min-width:0}
.exp-note{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.exp-amount{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--text);flex-shrink:0}

/* STATS GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.stat-value{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--accent)}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* BAR CHART */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;cursor:pointer}
.bar-row:last-child{margin-bottom:0}
.bar-label{width:50px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:2px}
.bar-fill-txt{font-family:var(--font-mono);font-size:9px;color:#000;font-weight:600;white-space:nowrap}
.bar-amount{width:68px;font-family:var(--font-mono);font-size:10.5px;color:var(--text);text-align:right;flex-shrink:0}

/* BRANCH */
.branch-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px
}
.branch-rank{
  width:26px;height:26px;border-radius:6px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:11px;color:var(--text-muted);flex-shrink:0
}
.branch-rank.top{background:var(--accent-dim);color:var(--accent)}
.branch-info{flex:1;min-width:0}
.branch-name{font-size:14px;font-weight:600}
.branch-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.branch-total{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--success);flex-shrink:0}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:16px 16px 32px;
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}

/* FORM */
.form-group{margin-bottom:13px}
.form-label{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.06em}
.form-input,.form-select{
  width:100%;height:44px;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:var(--font-body);font-size:15px;
  padding:0 12px;outline:none;transition:border-color .15s;-webkit-appearance:none
}
.form-input:focus,.form-select:focus{border-color:rgba(245,158,11,0.5)}
.form-select option{background:var(--surface2)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.btn{
  height:44px;border-radius:10px;border:none;font-family:var(--font-body);
  font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%
}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:active{background:var(--accent2)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,0.35);margin-top:8px}
.btn-danger:active{background:rgba(239,68,68,0.1)}

/* TOAST */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + 72px);left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:9px 18px;font-size:13px;opacity:0;transition:all .25s;
  pointer-events:none;z-index:300;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state svg{opacity:.25;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.7}

/* CONFIRM DIALOG */
.confirm-dialog{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin:0 16px;max-width:320px;width:calc(100% - 32px)}
.confirm-dialog h3{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm-dialog p{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;height:40px;border-radius:9px;border:1px solid var(--border);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.confirm-btns .cb-cancel{background:var(--surface2);color:var(--text)}
.confirm-btns .cb-ok{background:var(--danger);color:#fff;border-color:var(--danger)}
.modal-overlay.center{align-items:center}

@media(min-width:500px){
  .modal{border-radius:20px;margin:16px auto}
  .modal-overlay:not(.center){align-items:flex-end}
}
</style>
</head>

}
function triggerRestore(){ document.getElementById('restore-file').click(); }
function restoreData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try{
      const d = JSON.parse(ev.target.result);
      if(!d.dfData) throw 0;
      data = d; if(!data.expData) data.expData = {};
      saveData(); renderAll(); toast('✅ Restore สำเร็จ');
    }catch{ toast('❌ ไฟล์ไม่ถูกต้อง'); }
  };
  r.readAsText(f); e.target.value='';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),2400);
}
function fmt(v){
  if(v==null||v==='') return null;
  const n=parseFloat(v); if(isNaN(n)) return null;
  return n.toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function fmtK(v){
  if(v>=1e6) return (v/1e6).toFixed(1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(1)+'K';
  return Math.round(v).toLocaleString();
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openModal(id){ document.getElementById(id).classList.add('open'); }
function showConfirm(title,msg,cb){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCb = cb;
  document.getElementById('confirm-ok-btn').onclick = ()=>{ closeModal('modal-confirm'); if(confirmCb) confirmCb(); };
  openModal('modal-confirm');
}

function switchTab(tab){
  curTab = tab;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  document.querySelectorAll('.tab-page').forEach(el=>el.classList.toggle('active',el.id==='tab-'+tab));
  const fab = document.getElementById('fab');
  fab.style.display = (tab==='df'||tab==='exp'||tab==='invest') ? 'flex' : 'none';
  // Hide month bar on invest tab (not month-based)
  document.getElementById('month-bar').style.display = (tab==='invest') ? 'none' : 'flex';
  renderCurrentTab();
}
function openAddModal(){
  if(curTab==='df') openDfModal(null,curMonth);
  else if(curTab==='exp') openExpModal(null,curMonth);
  else if(curTab==='invest') openInvestModal(null);
}

function renderMonthBar(){
  const bar = document.getElementById('month-bar');
  bar.innerHTML = '';
  MONTHS.forEach(m=>{
    const hasData = (data.dfData[m]||[]).length > 0;
    const chip = document.createElement('div');
    chip.className = 'month-chip'+(m===curMonth?' active':'')+(hasData?'':' no-data');
    chip.textContent = m;
    chip.onclick = ()=>selectMonth(m);
    bar.appendChild(chip);
  });
  setTimeout(()=>{
    const a = bar.querySelector('.month-chip.active');
    if(a) a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  },60);
}
function selectMonth(m){ curMonth=m; renderMonthBar(); renderCurrentTab(); }

function renderAll(){ renderMonthBar(); renderCurrentTab(); }
function renderCurrentTab(){
  if(curTab==='df') renderDfTab();
  else if(curTab==='exp') renderExpTab();
  else if(curTab==='overview') renderOverviewTab();
  else if(curTab==='branch') renderBranchTab();

}

  const offCount = entries.length - valid.length;

  const expTotal = expEntries.reduce((s,e)=>s+(e.amount||0),0);
  const avg = valid.length ? total/valid.length : 0;

  document.getElementById('df-summary').innerHTML = `
    <div class="month-summary">
      <div class="ms-stat">
        <div class="ms-label">รวม DF</div>
        <div class="ms-value">฿${fmtK(total)}</div>
      </div>
      <div class="ms-stat">
        <div class="ms-label">ไป/OFF</div>
        <div class="ms-value"><span style="color:var(--success)">${valid.length}</span><span style="color:var(--text-muted);font-size:14px"> / </span><span style="color:${offCount>0?'var(--danger)':'var(--text-muted)'}">${offCount}</span></div>
      </div>
      <div class="ms-stat">

        <div class="ms-label">ค่าใช้จ่าย</div>
        <div class="ms-value" style="color:var(--danger);font-size:14px">฿${fmtK(expTotal)}</div>
      </div>
    </div>`;

  const list = document.getElementById('df-list');
  if(!entries.length){
    list.innerHTML=`<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <p>ยังไม่มีข้อมูล DF<br>กด <strong>+</strong> เพื่อเพิ่มทริป</p></div>`;

function renderBranchTab(){
  const map = {};
  MONTHS.forEach(m=>{
    (data.dfData[m]||[]).forEach(e=>{
      if(!map[e.b]) map[e.b]={name:e.b,total:0,work:0,off:0,months:new Set()};
      if(e.v!=null){ map[e.b].total+=e.v; map[e.b].work++; }
      else { map[e.b].off++; }
      map[e.b].months.add(m);
    });
  });
  const branches = Object.values(map).map(b=>({...b,avg:b.work?b.total/b.work:0})).sort((a,b)=>b.total-a.total);
  const el = document.getElementById('branch-content');
  if(!branches.length){ el.innerHTML=`<div class="empty-state"><p>ไม่มีข้อมูลสาขา</p></div>`; return; }

  const totWork = branches.reduce((s,b)=>s+b.work,0);
  const totOff = branches.reduce((s,b)=>s+b.off,0);
  const totAll = totWork+totOff;
  const bestM = MONTHS.map(m=>{
    const df=data.dfData[m]||[]; const v=df.filter(e=>e.v!=null);
    return{m,total:v.reduce((s,e)=>s+e.v,0)};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total)[0];
  const mostOff = [...branches].filter(b=>b.off>0).sort((a,b)=>b.off-a.off)[0];
  const bestAvg = [...branches].filter(b=>b.work>=2).sort((a,b)=>b.avg-a.avg)[0];
  const mostFreq = [...branches].sort((a,b)=>b.work-a.work)[0];

  el.innerHTML = `
    <div class="stat-grid cols3" style="margin-bottom:10px">
      <div class="stat-card">
        <div class="stat-label">สาขา</div>
        <div class="stat-value">${branches.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ไปทำงาน</div>
        <div class="stat-value" style="color:var(--success)">${totWork}</div>
        <div class="stat-sub">${totAll?Math.round(totWork/totAll*100):0}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">OFF รวม</div>
        <div class="stat-value" style="color:var(--danger)">${totOff}</div>
        <div class="stat-sub">${totAll?Math.round(totOff/totAll*100):0}%</div>
      </div>
    </div>
    <div class="section-header"><span class="section-title">อันดับสาขา</span></div>
    ${branches.map((b,i)=>`
      <div class="branch-item">
        <div class="branch-rank ${i<3?'top':''}">${i+1}</div>
        <div class="branch-info">
          <div class="branch-name">${b.name}</div>
          <div class="branch-meta">
            <span style="color:var(--success)">ไป ${b.work}</span>${b.off>0?` · <span style="color:var(--danger)">OFF ${b.off}</span>`:''} · ${b.months.size} เดือน
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="branch-total">฿${fmt(b.total)||'0'}</div>
          ${b.work>=2?`<div style="font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono)">avg ฿${fmtK(b.avg)}</div>`:''}
        </div>
      </div>`).join('')}
    <div class="section-header" style="margin-top:4px"><span class="section-title">💡 Insights</span></div>
    <div class="insight-box">
      ${[
        branches[0]&&{i:'🏆',t:`${branches[0].name} ยอดรวมสูงสุด ฿${fmt(branches[0].total)} (${branches[0].work} ครั้ง)`},
        mostFreq&&{i:'🔁',t:`${mostFreq.name} ไปบ่อยที่สุด ${mostFreq.work} ครั้ง`},
        mostOff&&{i:'❌',t:`${mostOff.name} OFF บ่อยที่สุด ${mostOff.off} ครั้ง`},
        bestAvg&&{i:'📈',t:`${bestAvg.name} ยอดเฉลี่ย/ครั้ง ฿${fmt(bestAvg.avg)}`},
        bestM&&{i:'📅',t:`เดือนดีที่สุด ${bestM.m} ยอด ฿${fmt(bestM.total)}`},
        {i:'📊',t:`ไปทำงาน ${totWork} วัน (${totAll?Math.round(totWork/totAll*100):0}%) | OFF ${totOff} วัน (${totAll?Math.round(totOff/totAll*100):0}%)`},
      ].filter(Boolean).map(x=>`<div class="insight-row"><span class="insight-icon">${x.i}</span><span class="insight-txt">${x.t}</span></div>`).join('')}
    </div>`;
}

let isOff = false;
function toggleOff(){
  isOff = !isOff;
  document.getElementById('off-toggle').classList.toggle('active', isOff);
  document.getElementById('df-value-group').style.display = isOff ? 'none' : 'block';
  if(isOff) document.getElementById('df-value').value = '';
}
function setOffState(val){
  isOff = (val === null);
  document.getElementById('off-toggle').classList.toggle('active', isOff);
  document.getElementById('df-value-group').style.display = isOff ? 'none' : 'block';
}

function populateMonthSel(selId, selected){
  const sel = document.getElementById(selId);
  sel.innerHTML = MONTHS.map(m=>`<option value="${m}"${m===selected?' selected':''}>${m}</option>`).join('');
}
function populateBranchList(){
  const set = new Set();
  MONTHS.forEach(m=>(data.dfData[m]||[]).forEach(e=>set.add(e.b)));
  document.getElementById('branch-datalist').innerHTML = [...set].sort().map(b=>`<option value="${b}">`).join('');
}

function openDfModal(idx, month){
  editDfIdx = idx; editDfMonth = month||curMonth;
  populateMonthSel('df-month', editDfMonth);
  populateBranchList();
  if(idx!==null){
    const e = (data.dfData[editDfMonth]||[])[idx]; if(!e) return;
    document.getElementById('modal-df-title').textContent = 'แก้ไข DF';
    document.getElementById('df-day').value = e.d;
    document.getElementById('df-branch').value = e.b;
    document.getElementById('df-value').value = e.v!==null ? e.v : '';
    setOffState(e.v);
    document.getElementById('btn-del-df').style.display = 'block';
  } else {
    document.getElementById('modal-df-title').textContent = 'เพิ่ม DF';
    document.getElementById('df-day').value = '';
    document.getElementById('df-branch').value = '';
    document.getElementById('df-value').value = '';
    setOffState(0);
    document.getElementById('btn-del-df').style.display = 'none';
  }
  openModal('modal-df');
}

function saveDf(){
  const day = parseInt(document.getElementById('df-day').value);
  const month = document.getElementById('df-month').value;
  const branch = document.getElementById('df-branch').value.trim();
  const vs = document.getElementById('df-value').value.trim();
  const value = isOff ? null : (vs===''? null : parseFloat(vs));
  if(!day||day<1||day>31){ toast('❌ กรุณาใส่วันที่'); return; }
  if(!branch){ toast('❌ กรุณาใส่ชื่อสาขา'); return; }
  if(!data.dfData[month]) data.dfData[month]=[];
  if(editDfIdx!==null){
    if(editDfMonth && editDfMonth!==month){
      data.dfData[editDfMonth].splice(editDfIdx,1);
      if(!data.dfData[month]) data.dfData[month]=[];
      data.dfData[month].push({d:day,b:branch,v:value});
    } else {
      data.dfData[month][editDfIdx]={d:day,b:branch,v:value};
    }
  } else {
    data.dfData[month].push({d:day,b:branch,v:value});
  }
  saveData(); curMonth=month; closeModal('modal-df'); renderAll(); toast('✅ บันทึกสำเร็จ');
}

function confirmDeleteDf(){
  showConfirm('ลบ DF','ต้องการลบรายการนี้ใช่ไหม?',()=>{
    if(editDfIdx===null) return;
    (data.dfData[editDfMonth]||[]).splice(editDfIdx,1);
    saveData(); closeModal('modal-df'); renderAll(); toast('🗑 ลบแล้ว');
  });
}

function openExpModal(idx, month){

    document.getElementById('exp-day').value=e.d||'';

    document.getElementById('exp-type').value='ตั๋ว';
    document.getElementById('exp-note').value='';
    document.getElementById('exp-amount').value='';

function saveExp(){
  const day=parseInt(document.getElementById('exp-day').value)||null;
  const month=document.getElementById('exp-month').value;
  const type=document.getElementById('exp-type').value;
  const note=document.getElementById('exp-note').value.trim();
  const amount=parseFloat(document.getElementById('exp-amount').value)||0;
  if(!data.expData[month]) data.expData[month]=[];
  if(editExpIdx!==null){
    if(editExpMonth&&editExpMonth!==month){
      data.expData[editExpMonth].splice(editExpIdx,1);
      if(!data.expData[month]) data.expData[month]=[];
      data.expData[month].push({d:day,type,note,amount});
    } else {
      data.expData[month][editExpIdx]={d:day,type,note,amount};
    }
  } else {
    data.expData[month].push({d:day,type,note,amount});
  }
  saveData(); curMonth=month; closeModal('modal-exp'); renderAll(); toast('✅ บันทึกสำเร็จ');
}

function confirmDeleteExp(){
  showConfirm('ลบค่าใช้จ่าย','ต้องการลบรายการนี้ใช่ไหม?',()=>{
    if(editExpIdx===null) return;
    (data.expData[editExpMonth]||[]).splice(editExpIdx,1);
    saveData(); closeModal('modal-exp'); renderAll(); toast('🗑 ลบแล้ว');
  });
}

document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); });
});

(function(){
  let sx=0,sy=0,sTime=0;
  const el = document.getElementById('content');
  el.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; sTime=Date.now();
  },{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    const dt=Date.now()-sTime;
    if(dt>400||Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<50) return;
    if(curTab!=='df'&&curTab!=='exp') return;
    const idx=MONTHS.indexOf(curMonth);
    if(dx<0&&idx<MONTHS.length-1){ selectMonth(MONTHS[idx+1]); }
    else if(dx>0&&idx>0){ selectMonth(MONTHS[idx-1]); }
  },{passive:true});
})();

// ============================================================
// INVESTMENT
// ============================================================
let editInvIdx = null;
let isTrackOnly = false;

function toggleTrackOnly(){
  isTrackOnly = !isTrackOnly;
  setTrackOnlyUI(isTrackOnly);
}
function setTrackOnlyUI(on){
  isTrackOnly = on;
  document.getElementById('track-only-toggle').classList.toggle('active', on);
  document.getElementById('inv-cost-fields').style.display = on ? 'none' : 'block';
  if(on){
    document.getElementById('inv-price').value = '';
  }
}

function fmtNum(v){
  if(v==null||isNaN(v)) return '—';
  const n = Number(v);
  if(n === Math.floor(n)) return n.toLocaleString('en-US');
  return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:6});
}

function timeAgo(t){
  if(!t) return '';
  const sec = Math.floor((Date.now()-t)/1000);
  if(sec < 60) return sec + ' วิที่แล้ว';
  if(sec < 3600) return Math.floor(sec/60) + ' นาทีที่แล้ว';
  if(sec < 86400) return Math.floor(sec/3600) + ' ชั่วโมงที่แล้ว';
  return Math.floor(sec/86400) + ' วันที่แล้ว';
}

function renderInvestTab(){
  const holdings = data.investData || [];
  const cache = data.priceCache || {};
  const usdThbRate = data.usdThbRate || 36;

  const items = holdings.map(h => {
    const c = cache[h.symbol];
    const buyCur = h.currency || 'THB';
    const trackOnly = !!h.trackOnly;
    let costThb = trackOnly ? 0 : (h.qty||0) * (h.avgPrice||0);
    if(!trackOnly && buyCur === 'USD') costThb *= usdThbRate;
    let currentThb = null;
    if(c && c.thb != null) currentThb = c.thb;
    const valueThb = currentThb !== null ? (h.qty||0) * currentThb : null;
    const pl = (trackOnly || valueThb===null) ? null : valueThb - costThb;
    const plPct = (!trackOnly && costThb > 0 && pl !== null) ? (pl/costThb*100) : null;
    return {...h, trackOnly, costThb, currentThb, valueThb, pl, plPct, hasPrice: !!c, t: c?c.t:0};
  });

  // Total value = all items (including trackOnly)
  const totalValue = items.reduce((s,i)=>s+(i.valueThb||0),0);
  // Cost & P/L only from items with cost basis
  const trackedItems = items.filter(i=>!i.trackOnly && i.qty>0);
  const totalCost = trackedItems.reduce((s,i)=>s+(i.costThb||0),0);
  const trackedValue = trackedItems.reduce((s,i)=>s+(i.valueThb||0),0);
  const totalPL = trackedValue - totalCost;
  const totalPLPct = totalCost > 0 ? totalPL/totalCost*100 : 0;
  const trackOnlyValue = items.filter(i=>i.trackOnly).reduce((s,i)=>s+(i.valueThb||0),0);
  const times = items.filter(i=>i.t).map(i=>i.t);
  const lastUpdate = times.length ? Math.max(...times) : 0;

  let html = `
    <div class="refresh-bar">
      <span>${lastUpdate ? '🕐 อัปเดต ' + timeAgo(lastUpdate) : 'ยังไม่ได้อัปเดตราคา'}</span>
      <button id="btn-refresh" onclick="fetchPrices()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </div>
    <div class="inv-summary">
      <div class="inv-summary-card full">
        <div class="stat-label">มูลค่าพอร์ต (THB)</div>
        <div style="font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--accent);margin-top:2px">฿${fmtK(totalValue)}</div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px">
          <span style="color:var(--text-muted)">ทุน ฿${fmtK(totalCost)}</span>
          <span style="color:${totalPL>=0?'var(--success)':'var(--danger)'};font-family:var(--font-mono);font-weight:600">
            ${totalPL>=0?'+':'-'}฿${fmtK(Math.abs(totalPL))} (${totalPL>=0?'+':''}${totalPLPct.toFixed(2)}%)
          </span>
        </div>
        ${trackOnlyValue > 0 ? `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:11px;color:var(--text-muted)">
          📊 Track-only ฿${fmtK(trackOnlyValue)} (ไม่นับ P/L)
        </div>` : ''}
      </div>
      <div class="inv-summary-card">
        <div class="stat-label">USD / THB</div>
        <div style="font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--text);margin-top:2px">${usdThbRate.toFixed(2)}</div>
      </div>
      <div class="inv-summary-card">
        <div class="stat-label">รายการ</div>
        <div style="font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--text);margin-top:2px">${holdings.length}</div>
      </div>
    </div>
    <div class="section-header">
      <span class="section-title">สินทรัพย์</span>
      <span class="section-count">${items.filter(i=>i.qty>0).length} active</span>
    </div>`;

  if(!holdings.length){
    html += `<div class="empty-state"><p>ยังไม่มีสินทรัพย์<br>กด <strong>+</strong> เพื่อเพิ่ม</p></div>`;
  } else {
    // Sort: those with qty > 0 first, then by value desc
    const sorted = [...items].map((it,idx)=>({...it,_idx:idx})).sort((a,b)=>{
      if((a.qty>0) !== (b.qty>0)) return a.qty>0 ? -1 : 1;
      return (b.valueThb||0) - (a.valueThb||0);
    });
    sorted.forEach(it => {
      const cls = it.pl===null ? 'flat' : (Math.abs(it.pl)<0.01 ? 'flat' : (it.pl>0 ? 'up' : 'down'));
      const sign = it.pl>0 ? '+' : (it.pl<0 ? '-' : '');
      const typeLabel = {crypto:'Crypto',gold:'Gold',stock_us:'US Stock',stock_th:'TH Stock'}[it.type]||'Other';
      const iconText = (it.name||it.symbol).slice(0,3).toUpperCase();
      const subParts = [typeLabel, it.symbol];
      if(it.trackOnly) subParts.push('📊 Track-only');
      if(!it.hasPrice) subParts.push('⚠ ไม่มีราคา');
      html += `<div class="inv-item" onclick="openInvestModal(${it._idx})" ${it.qty===0?'style="opacity:0.55"':''}>
        <div class="inv-row1">
          <div class="inv-icon ${it.type}">${iconText}</div>
          <div class="inv-name">
            <div class="inv-name-main">${it.name||it.symbol}</div>
            <div class="inv-name-sub">${subParts.join(' · ')}</div>
          </div>
          <div class="inv-pl ${it.trackOnly?'flat':cls}">
            <div class="inv-pl-amt">${it.trackOnly ? (it.valueThb!==null?'฿'+fmtK(it.valueThb):'—') : (it.pl!==null?sign+'฿'+fmtK(Math.abs(it.pl)):'—')}</div>
            <div class="inv-pl-pct">${it.trackOnly ? 'มูลค่า' : (it.plPct!==null?(it.plPct>0?'+':'')+it.plPct.toFixed(2)+'%':'—')}</div>
          </div>
        </div>
        <div class="inv-row2">
          <span>Qty <b>${fmtNum(it.qty)}</b></span>
          <span>ทุน <b>${it.trackOnly?'—':'฿'+fmtK(it.costThb)}</b></span>
          <span>มูลค่า <b>${it.valueThb!==null?'฿'+fmtK(it.valueThb):'—'}</b></span>
        </div>
      </div>`;
    });
  }

  document.getElementById('invest-content').innerHTML = html;
}

function onInvTypeChange(){
  const type = document.getElementById('inv-type').value;
  const cur = document.getElementById('inv-currency');
  if(type === 'stock_us') cur.value = 'USD';
  else cur.value = 'THB';
  updateInvPriceLabel();
}
function updateInvPriceLabel(){
  const cur = document.getElementById('inv-currency').value;
  document.getElementById('inv-price-label').textContent = 'ราคาทุนเฉลี่ย ('+cur+')';
}

function openInvestModal(idx){
  editInvIdx = idx;
  if(idx !== null && data.investData[idx]){
    const it = data.investData[idx];
    document.getElementById('modal-inv-title').textContent = 'แก้ไข ' + (it.name||it.symbol);
    document.getElementById('inv-type').value = it.type;
    document.getElementById('inv-symbol').value = it.symbol;
    document.getElementById('inv-name').value = it.name;
    document.getElementById('inv-qty').value = it.qty || '';
    document.getElementById('inv-price').value = it.avgPrice || '';
    document.getElementById('inv-currency').value = it.currency || 'THB';
    document.getElementById('inv-note').value = it.note || '';
    document.getElementById('btn-del-inv').style.display = 'block';
    setTrackOnlyUI(!!it.trackOnly);
  } else {
    document.getElementById('modal-inv-title').textContent = 'เพิ่มสินทรัพย์';
    document.getElementById('inv-type').value = 'crypto';
    document.getElementById('inv-symbol').value = '';
    document.getElementById('inv-name').value = '';
    document.getElementById('inv-qty').value = '';
    document.getElementById('inv-price').value = '';
    document.getElementById('inv-currency').value = 'THB';
    document.getElementById('inv-note').value = '';
    document.getElementById('btn-del-inv').style.display = 'none';
    setTrackOnlyUI(false);
  }
  updateInvPriceLabel();
  document.getElementById('inv-currency').onchange = updateInvPriceLabel;
  openModal('modal-invest');
}

function saveInvest(){
  const type = document.getElementById('inv-type').value;
  const symbol = document.getElementById('inv-symbol').value.trim();
  const name = document.getElementById('inv-name').value.trim() || symbol;
  const qty = parseFloat(document.getElementById('inv-qty').value) || 0;
  const avgPrice = isTrackOnly ? 0 : (parseFloat(document.getElementById('inv-price').value) || 0);
  const currency = document.getElementById('inv-currency').value;
  const note = document.getElementById('inv-note').value.trim();
  const trackOnly = isTrackOnly;
  if(!symbol){ toast('❌ กรุณาใส่ symbol'); return; }
  if(!data.investData) data.investData = [];
  const obj = {type,symbol,name,qty,avgPrice,currency,note,trackOnly};
  if(editInvIdx !== null){
    obj.id = data.investData[editInvIdx].id;
    data.investData[editInvIdx] = obj;
  } else {
    obj.id = 'inv_' + Date.now();
    data.investData.push(obj);
  }
  saveData();
  closeModal('modal-invest');
  renderInvestTab();
  toast('✅ บันทึกสำเร็จ');
  fetchPrices(true);
}

function confirmDeleteInvest(){
  showConfirm('ลบสินทรัพย์','ต้องการลบรายการนี้ใช่ไหม?',()=>{
    if(editInvIdx === null) return;
    data.investData.splice(editInvIdx,1);
    saveData();
    closeModal('modal-invest');
    renderInvestTab();
    toast('🗑 ลบแล้ว');
  });
}

async function fetchPrices(silent){
  const holdings = data.investData || [];
  if(!holdings.length){ if(!silent) toast('⚠ ยังไม่มีสินทรัพย์'); return; }
  const btn = document.getElementById('btn-refresh');
  if(!silent && btn){
    btn.disabled = true;
    const sv = btn.querySelector('svg'); if(sv) sv.classList.add('spin');
  }
  try{
    const cryptoIds = new Set();
    const stocks = new Set();
    holdings.forEach(h=>{
      if(h.type==='crypto'||h.type==='gold') cryptoIds.add(h.symbol);
      else if(h.type==='stock_us'||h.type==='stock_th') stocks.add(h.symbol);
    });
    cryptoIds.add('tether'); // for USD/THB rate
    if(!data.priceCache) data.priceCache = {};

    // Fetch crypto from CoinGecko
    if(cryptoIds.size){
      try{
        const url = 'https://api.coingecko.com/api/v3/simple/price?ids='+[...cryptoIds].join(',')+'&vs_currencies=thb,usd';
        const r = await fetch(url);
        const d = await r.json();
        for(const id in d){
          data.priceCache[id] = {thb:d[id].thb, usd:d[id].usd, t:Date.now()};
        }
        if(d.tether && d.tether.thb) data.usdThbRate = d.tether.thb;
      }catch(e){ console.warn('crypto fail',e); }
    }

    // Fetch stocks via CORS proxy → Yahoo Finance
    const rate = data.usdThbRate || 36;
    const stockProms = [...stocks].map(async sym=>{
      try{
        const yUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym);
        const url = 'https://corsproxy.io/?'+encodeURIComponent(yUrl);
        const r = await fetch(url);
        const d = await r.json();
        const meta = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
        if(!meta) throw new Error('no meta');
        const priceNative = meta.regularMarketPrice;
        const cur = meta.currency || 'USD';
        const thb = cur === 'USD' ? priceNative * rate : priceNative;
        const usd = cur === 'USD' ? priceNative : priceNative / rate;
        data.priceCache[sym] = {thb, usd, native:priceNative, cur, t:Date.now()};
      }catch(e){ console.warn('stock fail',sym,e); }
    });
    await Promise.all(stockProms);

    saveData();
    if(curTab === 'invest') renderInvestTab();
    if(!silent) toast('✅ อัปเดตราคาแล้ว');
  } catch(e){
    if(!silent) toast('❌ อัปเดตไม่สำเร็จ');
  } finally {
    if(!silent && btn){
      btn.disabled = false;
      const sv = btn.querySelector('svg'); if(sv) sv.classList.remove('spin');
    }
  }
}

loadData();
renderAll();
// Auto-fetch prices in background on load
setTimeout(()=>fetchPrices(true), 1000);
</script>
